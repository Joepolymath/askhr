# Evaluation set for scripts/eval.py.
#
# expect_facts: every entry must appear in the answer (case-insensitive).
#   An entry can be a list of alternatives: any one of them counts.
# expect_unknown: true -> the bot must give the standard "I don't know" reply.
# expect_citation: optional document title that must be among the citations.

- question: What does the company do?
  expect_facts: [[route, routing], [freight, delivery]]

- question: Who is the CEO?
  expect_facts: [Amara Okafor]

- question: Who is the CTO?
  expect_facts: [Priya Raman]

- question: Who should I talk to about HR policy? Who leads HR?
  expect_facts: [Daniel Brooks]

- question: How many days of annual leave do I get?
  expect_facts: ["25"]
  expect_citation: Leave Policy

- question: Can I take holiday while I'm on probation?
  expect_facts: [["2 days", "two days"], [manager]]
  expect_citation: Leave Policy

- question: How many unused leave days can I carry over to next year?
  expect_facts: [["5", "five"], [March]]
  expect_citation: Leave Policy

- question: When do I need a doctor's note for sick leave?
  expect_facts: [["3", "three"]]
  expect_citation: Leave Policy

- question: How much parental leave does the primary caregiver get?
  expect_facts: [["16 weeks", "sixteen weeks"]]
  expect_citation: Leave Policy

- question: What is the maximum value of a gift I can accept from a supplier?
  expect_facts: ["75"]
  expect_citation: Code of Conduct

- question: How can I report a concern anonymously?
  expect_facts: [ethics@northwindlabs.example]
  expect_citation: Code of Conduct

- question: Which days am I expected in the office?
  expect_facts: [Tuesday, Thursday]
  expect_citation: Company Overview

- question: Who is our dental insurance provider?
  expect_unknown: true

- question: What is the CEO's salary?
  expect_unknown: true

- question: What is the office Wi-Fi password?
  expect_unknown: true

- question: Can I bring my dog to the office?
  expect_unknown: true

- question: What is the company car policy?
  expect_unknown: true
