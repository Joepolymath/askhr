services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askhr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askhr}
      POSTGRES_DB: ${POSTGRES_DB:-askhr}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate askhr_test database used by pytest.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askhr}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-askhr}:${POSTGRES_PASSWORD:-askhr}@db:5432/${POSTGRES_DB:-askhr}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-askhr}:${POSTGRES_PASSWORD:-askhr}@db:5432/askhr_test
    depends_on:
      db:
        condition: service_healthy
    # Migrations run on every start; Alembic is a no-op when already at head.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      # Vite dev server proxies /api to the backend, so the browser sees one origin.
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"

volumes:
  pgdata:
